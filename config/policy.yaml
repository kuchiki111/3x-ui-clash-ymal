# 只需修改此文件即可调整企业路由策略。
# ACL4SSR 规则内容会自动展开；下面的规则列表和顺序由你决定。
providers:
  LocalAreaNetwork: {behavior: classical, min_entries: 5}
  UnBan: {behavior: classical, min_entries: 1}
  ChinaDomain: {behavior: classical, min_entries: 10}
  ChinaIp: {behavior: ipcidr, min_entries: 100}
  ProxyGFWlist: {behavior: classical, min_entries: 100}
  BanAD: {behavior: classical, min_entries: 10}
  BanProgramAD: {behavior: classical, min_entries: 10}
# 3X-UI 提供实际节点；规则继续引用 PROXY，由它转到“节点选择”。
proxy-groups:
  - name: 节点选择
    type: select
    include-all-proxies: true
    proxies: []
  - name: PROXY
    type: select
    hidden: true
    proxies:
      - 节点选择
  - name: 兜底选择
    type: select
    proxies:
      - DIRECT
      - 节点选择
# 企业专用规则应放在最前面，匹配顺序会影响结果。
custom_rules: []
rules:
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,UnBan,DIRECT
  - RULE-SET,BanAD,REJECT
  - RULE-SET,BanProgramAD,REJECT
  - RULE-SET,ProxyGFWlist,PROXY
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,ChinaIp,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,兜底选择
